{# Shared add/edit fields. Expects `form_student` (dict) in the including template. #}
<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Name <span class="text-muted">(optional)</span></label>
    <input type="text" name="name" class="form-control" maxlength="60" value="{{ form_student.get('name') or '' }}" placeholder="Student label" />
  </div>
  <div class="col-md-3">
    <label class="form-label">Subject</label>
    <select name="subject" class="form-select">
      {% for v in ['Math', 'Portuguese'] %}<option value="{{ v }}" {{ 'selected' if form_student.get('subject') == v }}>{{ v }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="gender" class="form-select">
      {% for v in ['Female', 'Male'] %}<option value="{{ v }}" {{ 'selected' if form_student.get('gender') == v }}>{{ v }}</option>{% endfor %}
    </select>
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Age</label>
    <input type="number" name="age" class="form-control" min="10" max="30" step="1" value="{{ form_student.get('age') | int }}" required />
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label">Study time</label>
    <select name="studytime" class="form-select">
      {% for v, label in [(1, 'under 2 h / week'), (2, '2-5 h / week'), (3, '5-10 h / week'), (4, 'over 10 h / week')] %}
      <option value="{{ v }}" {{ 'selected' if form_student.get('studytime') | int == v }}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label">Past failures (0-4)</label>
    <input type="number" name="failures" class="form-control" min="0" max="4" step="1" value="{{ form_student.get('failures') | int }}" required />
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label">Absences</label>
    <input type="number" name="absences" class="form-control" min="0" max="100" step="1" value="{{ form_student.get('absences') | int }}" required />
  </div>

  <div class="col-6 col-md-3">
    <label class="form-label">Wants higher education</label>
    <select name="higher" class="form-select">
      {% for v in ['yes', 'no'] %}<option value="{{ v }}" {{ 'selected' if form_student.get('higher') == v }}>{{ v | capitalize }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label">Internet at home</label>
    <select name="internet" class="form-select">
      {% for v in ['yes', 'no'] %}<option value="{{ v }}" {{ 'selected' if form_student.get('internet') == v }}>{{ v | capitalize }}</option>{% endfor %}
    </select>
  </div>

  <div class="col-12"><hr class="my-1" /><p class="form-label mb-2 fw-semibold">Grades (0-20)</p></div>
  <div class="col-4">
    <label class="form-label">G1 (period 1)</label>
    <input type="number" name="G1" class="form-control" min="0" max="20" step="1" value="{{ form_student.get('G1') | int }}" required />
  </div>
  <div class="col-4">
    <label class="form-label">G2 (period 2)</label>
    <input type="number" name="G2" class="form-control" min="0" max="20" step="1" value="{{ form_student.get('G2') | int }}" required />
  </div>
  <div class="col-4">
    <label class="form-label">G3 (final)</label>
    <input type="number" name="G3" class="form-control" min="0" max="20" step="1" value="{{ form_student.get('G3') | int }}" required />
  </div>
</div>
