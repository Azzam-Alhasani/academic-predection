{# Student fields. Expects: f (dict), majors, genders; flag: with_name #}
<div class="row g-3">
  <div class="col-md-4"><label class="form-label">Name <span class="text-muted">(optional label)</span></label>
    <input type="text" name="name" class="form-control" maxlength="60" value="{{ f.get('name') or '' }}" placeholder="Student label" /></div>
  <div class="col-6 col-md-2"><label class="form-label">Gender</label>
    <select name="gender" class="form-select">{% for g in genders %}<option {{ 'selected' if f.get('gender') == g }}>{{ g }}</option>{% endfor %}</select></div>
  <div class="col-6 col-md-3"><label class="form-label">Major</label>
    <select name="major" class="form-select">{% for m in majors %}<option {{ 'selected' if f.get('major') == m }}>{{ m }}</option>{% endfor %}</select></div>
  <div class="col-6 col-md-3"><label class="form-label">Entry semester</label>
    <input type="text" name="entry_semester" class="form-control" required pattern="20\d\d (Spring|Summer|Fall)" placeholder="2025 Fall" value="{{ f.get('entry_semester') or current_semester }}" /></div>
</div>
