{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-12 col-md-6 col-lg-4"><div class="card"><div class="card-body p-4">
  <form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="mb-3"><label class="form-label">Current password</label><input type="password" name="old_password" class="form-control" required /></div>
    <div class="mb-3"><label class="form-label">New password</label><input type="password" name="new_password" class="form-control" minlength="8" required />
      <div class="form-text">At least 10 characters on a public server (8 locally), with letters and numbers.</div></div>
    <div class="mb-4"><label class="form-label">Repeat new password</label><input type="password" name="confirm_password" class="form-control" required /></div>
    <button class="btn btn-primary w-100">Change password</button>
  </form>
</div></div></div></div>
{% endblock %}
